name: release
# Runs on a vX.Y.Z tag: writes the tag's version into package.json and src/version.ts, builds,
# type checks and tests the package, packs it, and publishes the packed tarball to npm with a
# provenance statement.
#
# npm authenticates the publish job by trusted publishing (OIDC): on npmjs.com the package's trusted
# publisher names this repository and release.yml, and no token is stored here. An NPM_TOKEN
# repository secret, when set, is used instead; leave it unset otherwise. Only the publish job holds
# the OIDC token; the build job, which installs packages and runs code, never does.
on:
  push:
    tags: ['v*.*.*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # No dependency cache: a tag run would restore what another ref wrote into a release.
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          npm version "${TAG#v}" --no-git-tag-version
          printf 'export const VERSION = "%s";\n' "${TAG#v}" > src/version.ts
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Pack
        run: npm pack
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: costfluent-sdk-*.tgz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token npm exchanges for a publish credential and signs the provenance with.
      id-token: write
    steps:
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      # A token, even an empty one, would replace trusted publishing, so it is set only when present.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish costfluent-sdk-*.tgz --provenance --access public
